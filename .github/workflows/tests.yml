name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  DERIVED_DATA_PATH: DerivedData
  SCAN_CLONED_SOURCE_PACKAGES_PATH: DerivedData/SourcePackages
  MATCH_READONLY: 'true'
  FASTLANE_SKIP_UPDATE_CHECK: 1

jobs:
  tests:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true
        
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
    - name: Cache bundler gems
      uses: actions/cache@v4
      id: cache-bundler
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-
          
    - name: Bundle config
      run: bundle config set path 'vendor/bundle'
      
    - name: Bundle install
      run: bundle install
      if: steps.cache-bundler.outputs.cache-hit != 'true'
      
    - name: Run tests
      run: bundle exec fastlane tests
