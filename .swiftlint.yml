# SwiftLint configuration for Swift 6
# Based on Swift 6 and iOS 18 requirements

# Rules to disable
disabled_rules:
  - multiple_closures_with_trailing_closure
  - todo  # Allow TODO comments during modernization
  - nesting  # Allow nested types for APIClient.Result.CodingKeys
  - file_header  # Temporarily disable during modernization

# Optional rules to enable for Swift 6
opt_in_rules:
  - strict_fileprivate
  - private_over_fileprivate
  - redundant_type_annotation
  - explicit_init
  - operator_usage_whitespace
  - vertical_parameter_alignment_on_call
  - unneeded_parentheses_in_closure_argument
  - trailing_closure
  - switch_case_alignment
  - sorted_imports
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - closure_spacing
  - empty_count

# Concurrency and Swift 6 specific rules
  - actor_scope
  - global_actor_usage

# Paths to exclude from linting
excluded:
  - Carthage
  - Vendor
  - fastlane
  - DerivedData
  - .build
  - "*/Generated/*"
  - "*/Pods/*"

# Line length
line_length:
  warning: 120
  error: 150

# File length
file_length:
  warning: 400
  error: 500

# Function body length
function_body_length:
  warning: 60
  error: 80

# Type body length  
type_body_length:
  warning: 250
  error: 350

# Identifier name lengths
identifier_name:
  min_length: 1
  max_length:
    warning: 50
    error: 60

# Force unwrapping
force_unwrapping:
  severity: warning


# Analyzer rules for Swift 6
analyzer_rules:
  - explicit_self
  - unused_import
  - unused_declaration
